---
name: Probe Android 8.1 x86 emulator
on:
  push:
    branches:
      - arena/6ccbd69f-mattermost-mobile
    paths:
      - .github/workflows/p585-encma-diagnostic-temp.yml
permissions:
  contents: read
  checks: write
jobs:
  emulator-image-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm-p585.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm
      - name: Boot the Android 8.1 Google APIs x86 image
        uses: ReactiveCircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 27
          target: google_apis
          arch: x86
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          disable-linux-hw-accel: false
          script: |
            sdk=$(adb shell getprop ro.build.version.sdk | tr -d '\r')
            abi=$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')
            qemu=$(adb shell getprop ro.kernel.qemu | tr -d '\r')
            printf 'SDK=%s ABIS=%s QEMU=%s\n' "$sdk" "$abi" "$qemu" > "$RUNNER_TEMP/probe.txt"
            test "$sdk" = 27 && test "$qemu" = 1
            case ",$abi," in *,x86,*) ;; *) exit 1 ;; esac
      - name: Publish probe result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          probe = temp / 'probe.txt'
          result = probe.read_text().strip() if probe.exists() else 'Emulator did not reach the probe script.'
          payload = {
              'name': 'p585-encma-emulator-image-probe',
              'head_sha': os.environ['GITHUB_SHA'],
              'status': 'completed',
              'conclusion': 'success' if os.environ['JOB_STATUS'] == 'success' else 'failure',
              'output': {'title': 'Android 8.1 emulator image', 'summary': result},
          }
          temp.joinpath('probe-check.json').write_text(json.dumps(payload))
          PY
          gh api "repos/$GITHUB_REPOSITORY/check-runs" --method POST --input "$RUNNER_TEMP/probe-check.json" >/dev/null || true
