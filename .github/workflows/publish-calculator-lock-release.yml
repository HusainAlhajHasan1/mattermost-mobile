---
name: publish-calculator-lock-release

# Publishes the APK built by calculator-lock-android-build.yml to a GitHub
# Release so it has a permanent, direct download link (Actions artifacts
# expire after 30 days).

on:
  push:
    branches:
      - arena/391bd85f-mattermost-mobile
    paths:
      - .github/workflows/publish-calculator-lock-release.yml
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run ID of calculator-lock-android-build to publish"
        required: false
        default: "41565464526"

permissions:
  contents: write
  actions: read

jobs:
  publish-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Download APK from the build run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ inputs.build_run_id || '41565464526' }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name mattermost-calculator-lock-arm64-apk \
            --dir release-assets

      - name: Publish GitHub Release with the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -lh release-assets/
          test -s release-assets/app-release.apk
          mv release-assets/app-release.apk release-assets/Mattermost-CalculatorLock-arm64.apk
          sha256sum release-assets/Mattermost-CalculatorLock-arm64.apk

          tag="v2.46.0-calculator-lock.1"
          title="Mattermost with Calculator Lock (test build)"
          notes="Test build of Mattermost 2.46.0 with the **Calculator Lock** feature (Settings → Advanced Settings → Calculator App Lock): disguises the app as a working calculator behind an 8-digit PIN entered as \`PIN\` + \`=\`, and hides notifications while enabled.

          **Mattermost-CalculatorLock-arm64.apk** — arm64-v8a, debug-signed sideload build. If the official Mattermost Beta (same package name, different signature) is already installed, uninstall it first — note this removes its local data and you will need to log in again.

          Source: PR #1, branch \`arena/391bd85f-mattermost-mobile\`."

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" release-assets/Mattermost-CalculatorLock-arm64.apk --clobber
          else
            gh release create "$tag" release-assets/Mattermost-CalculatorLock-arm64.apk \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "$title" \
              --notes "$notes"
          fi
