---
name: publish-calculator-lock-release

# Publishes the ENCMA APK built by phase1-android-build.yml to a GitHub
# Release so it has a permanent, direct download link (Actions artifacts
# expire after 30 days).

on:
  push:
    branches:
      - arena/391bd85f-mattermost-mobile
    paths:
      - .github/workflows/publish-calculator-lock-release.yml
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run ID of calculator-lock-android-build to publish"
        required: false
        default: "41574191092"

permissions:
  contents: write
  actions: read

jobs:
  publish-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Download APK from the build run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ inputs.build_run_id || '41574191092' }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name encma-wireguard-arm64-release-server-ca-import \
            --dir release-assets

      - name: Publish GitHub Release with the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -lh release-assets/
          test -s release-assets/app-release.apk
          mv release-assets/app-release.apk release-assets/ENCMA-CalculatorLock-arm64.apk
          sha256sum release-assets/ENCMA-CalculatorLock-arm64.apk

          tag="encma-calculator-lock.2"
          title="ENCMA with Calculator Lock (test build)"
          notes="Test build of the **ENCMA** app (Mattermost 2.46.0) with the **Calculator Lock** feature (Settings → Advanced Settings → Calculator App Lock): disguises the app as a working calculator behind an 8-digit PIN entered as \`PIN\` + \`=\`, and hides notifications while enabled.

          **Update in this build:** the cold-start splash screen now shows the Calculator logo on the dark calculator background while the disguise is enabled, so the original app logo no longer flashes before the calculator keypad appears.

          **ENCMA-CalculatorLock-arm64.apk** — arm64-v8a, debug-signed sideload build (package \`com.encma.hxmain\`). Signed with the same debug key as previous ENCMA test builds, so it can be installed over them without uninstalling.

          Source: PR #1, branch \`arena/391bd85f-mattermost-mobile\`."

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" release-assets/ENCMA-CalculatorLock-arm64.apk --clobber
          else
            gh release create "$tag" release-assets/ENCMA-CalculatorLock-arm64.apk \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "$title" \
              --notes "$notes"
          fi
