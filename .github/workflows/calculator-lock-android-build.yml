---
name: calculator-lock-android-build

# Builds an installable arm64 release APK (debug-signed via the project's
# default fallback when no MATTERMOST_RELEASE_STORE_FILE is configured) so
# the Calculator Lock feature can be tested on a real device without the
# Play Store signing secrets used by the beta/release workflows.

on:
  push:
    branches:
      - arena/391bd85f-mattermost-mobile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-calculator-lock-android-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare Node dependencies
        uses: ./.github/actions/prepare-node-deps

      - name: Set up JDK 17
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Jetify Android libraries
        run: ./node_modules/.bin/jetify

      - name: Build arm64 release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --stacktrace

      - name: Verify APK identity and Calculator alias
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt_bin"
          "$aapt_bin" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='com.mattermost.rnbeta'" "$RUNNER_TEMP/apk-badging.txt"
          "$aapt_bin" dump xmltree "$apk" AndroidManifest.xml > "$RUNNER_TEMP/apk-manifest.txt"
          grep -F "MainActivityCalculator" "$RUNNER_TEMP/apk-manifest.txt"
          ls -lh "$apk"
          sha256sum "$apk"

      - name: Upload installable arm64 APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mattermost-calculator-lock-arm64-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
